<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0}iframe{border:0}</style></head>
<body>
<iframe id="f" src="index.html" width="1600" height="900"></iframe>
<script>
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    const w = f.contentWindow, d = w.document;
    d.documentElement.style.scrollBehavior = 'auto';
    d.getElementById('detect-toggle').click();          // liga no topo
    w.scrollTo(0, d.getElementById('formacao').offsetTop - 60);  // rola até a formação
    setTimeout(() => {
      const nome = [...d.querySelectorAll('.det-layer--fixed .det')].map(x => x.textContent);
      document.title = 'fixed=' + nome.join(',') + ' scrollY=' + Math.round(w.scrollY);
    }, 1500);
  });
</script>
</body></html>
